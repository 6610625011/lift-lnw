const SimCore = (function(){ const module = { exports: {} }; // JavaScript mirror of include/elevator_sim.h (same rules, same constants).
// Used by scripts/fake-esp32.cjs and the browser preview. Time is passed in (ms), like the C++ class.
// Keep in sync with config.h / elevator_sim.h.
function createSim(options = {}) {
  const C = {
    initial: [5, 14, 3, 9], home: 1, minFloor: 1, maxFloor: 20,
    stepMs: 2000, doorOpenMs: 7000, doorClosingMs: 3000, selectTimeoutMs: 30000, arrivalMs: 10000,
    ambientCheckMs: 3000, ambientPercent: 55, ambientMaxBusy: 2, ambientDwellMs: 10000,

    ambient: options.ambient !== false,

    eta: [0, 0, 0, 0], phase: 'idle', sel: -1, dest: 0, hall: C.home, boarded: false, entry: 0, doorClosing: false, doorClosingAt: 0,

  }
  function enter(now) {

  }
  function setEntry(value) {

  }

    if (sim.phase !== 'boarding' || !sim.boarded || sim.dest) return false;
    if (!Number.isInteger(floor) || floor < C.minFloor || floor > C.maxFloor || floor === sim.cars[sim.sel].floor) return false;

  }

    if (c.mode === 'moving') {
      if (now - c.stepAt < C.stepMs) return false;

    }
    if (c.mode === 'dwelling' && now - c.dwellAt >= C.ambientDwellMs) { c.mode = 'free'; c.target = 0; return true; }
    return false;
  }
  function maybeStartBackgroundTrip(now) {
    if (now - sim.lastSpawn < C.ambientCheckMs) return false;
    sim.lastSpawn = now;

    for (let a = 0; a < 8 && target === c.floor; a++) target = C.minFloor + Math.floor(rand() * (C.maxFloor - C.minFloor + 1));

  }
  function tick(now) {
    let changed = false;
    sim.cars.forEach((c, i) => { if (!(i === sim.sel && sim.phase !== 'coming')) changed = stepBackground(c, now) || changed; });
    if (sim.ambient) changed = maybeStartBackgroundTrip(now) || changed;
    const car = sim.sel >= 0 ? sim.cars[sim.sel] : null;
    if (sim.phase === 'coming' && car.mode === 'free') {
      if (car.floor === sim.hall) { go('boarding', now); changed = true; }
      else if (now - sim.lastStepAt >= C.stepMs) {
        car.floor += sim.hall > car.floor ? 1 : -1; sim.lastStepAt = now; changed = true;

      }

      car.floor += sim.dest > car.floor ? 1 : -1; sim.lastStepAt = now; changed = true;
      if (car.floor === sim.dest) go('arrived', now);

      if (sim.dest) {
        if (sim.doorClosing) { if (now - sim.doorClosingAt >= C.doorClosingMs) { go('riding', now); changed = true; } }
        else if (now - sim.selectedAt >= C.doorOpenMs) { sim.doorClosing = true; sim.doorClosingAt = now; changed = true; }

    return changed;
  }
  function lcd() {
    const f = sim.cars.map((c) => c.floor), car = sim.cars[sim.sel], c = car && car.id, n = car && car.floor;

      case 'coming': return [`GO TO LIFT ${c}`, `NOW:${pad(n)} HALL:${pad(sim.hall)}`];
      case 'boarding':
        if (!sim.boarded) return [`LIFT ${c} OPEN`, 'PRESS TO ENTER'];
        if (sim.dest) return [`LIFT ${c} TO F${pad(sim.dest)}`, sim.doorClosing ? '>DOORS CLOSING<' : 'DOOR OPEN'];

    }
  }
  // Same fields as the firmware's MQTT "state" message (without boot_id/uptime_ms).

    const floors = {}, targets = {}, eta_s = {};

    return body;
  }

}

const component = (function(){ 
return {
  data() { return { myFloor: 1 }; },
  watch: { 'msg.payload.state.hall_floor': { immediate: true, handler(v) { if (v && (this.msg?.payload?.state?.phase || 'idle') === 'idle') this.myFloor = v; } } },
  computed: {
    view() { return this.msg?.payload || {}; },
    busyOthers() { return this.ids.some(id => (this.view.state?.targets?.[id]||0)>0); },
    ids() { return ['A','B','C','D']; },
    floorList() { return Array.from({length:20},(_,i)=>20-i); },
    hall() { return this.phase==='idle' ? this.myFloor : (this.view.state?.hall_floor || 1); },
    dest() { return this.view.state?.destination || 0; },
    canSelect() { return this.view.online && this.phase==='boarding' && !!this.view.state?.boarded && !this.dest && !this.view.pending; },
    canEnter() { return this.view.online && this.phase==='boarding' && !this.view.state?.boarded && !this.view.pending; },
    typed() { return this.view.state?.entry || 0; },
    padFloors() { return Array.from({length:20},(_,i)=>i+1); },

    tripText() {

      if(this.ambientBusy) return 'ไปที่ลิฟต์ '+a+' · ลิฟต์ส่งผู้โดยสารอื่นถึงชั้น '+this.view.state.targets[a]+' ก่อน แล้วจะมารับคุณที่ชั้น '+this.hall+' (ประเมิน ~'+(this.view.state?.eta_s?.[a]??'?')+' วินาที)';

      if(!this.view.state?.boarded) return 'ลิฟต์ '+a+' เปิดประตูรออยู่ที่ชั้น '+this.hall+' · กด "เดินเข้าลิฟต์ '+a+'" (หรือกดปุ่มที่บอร์ด ESP32)';
      return this.typed ? 'คุณอยู่ในลิฟต์ '+a+' · กำลังกดชั้น '+this.typed+' ที่แป้นกด · กด # เพื่อยืนยัน' : 'คุณอยู่ในลิฟต์ '+a+' · กดเลือกชั้นที่แป้นกดบนบอร์ด ESP32 (หรือแผงปุ่มบนหน้าเว็บ)'; }

  methods: {

    otherTarget(id) { const t=this.view.state?.targets?.[id]||0; return t && t!==this.floorOf(id) ? t : 0; },
    arrow(id) { if(id===this.assigned && this.moving) return this.direction>0?'▲':'▼'; const t=this.otherTarget(id); return t ? (t>this.floorOf(id)?'▲':'▼') : ''; },
    carClass(id) { const mine=id===this.assigned && this.moving; return {assigned:id===this.assigned, moving:mine, ambient:!mine && !!this.otherTarget(id), stale:!this.view.online, 'has-state':!!this.view.state}; },
    trail(id) {
      if(id!==this.assigned || !this.moving) return null;
      const f=this.floorOf(id), t=this.target;
      return {bottom:(Math.min(f,t)-1)*24+14+'px', height:Math.abs(t-f)*24+'px'};
    },
    status(id) { if(!this.view.online) return 'ข้อมูลไม่สด'; if(this.view.state?.assigned === id) return this.ambientBusy ? 'ส่งผู้โดยสารอื่นก่อน' : this.phaseLabel; const t=this.view.state?.targets?.[id]||0; return t ? (this.otherTarget(id) ? 'พาผู้โดยสารไปชั้น '+t : 'ผู้โดยสารกำลังลง') : 'ว่าง'; },
    etaText(id) { const e=this.view.state?.eta_s?.[id]; return e===undefined ? '' : 'ประเมินถึงคุณ ~'+e+' วินาที'; }
  }
}
 })();
let S = SimCore.createSim();
let t = 0;                       // simulated clock in ms
const events = [];
const labels = { coming:'มอบหมายลิฟต์แล้ว · ให้ไปที่ลิฟต์ที่ได้รับมอบหมาย', boarding:'ลิฟต์ถึงแล้ว รอเดินเข้า / เลือกชั้น', riding:'เลือกชั้นแล้ว · กำลังเดินทาง', arrived:'ถึงปลายทางแล้ว', idle:'พร้อมรับคำขอใหม่' };
let lastPhase = 'idle';
const app = Vue.createApp({
  ...component,
  template: "\r\n  <div class=\"elevator-app\">\r\n    <div class=\"lift-heading\"><div><div class=\"eyebrow\">ESP32 · MQTT · NODE-RED</div><h1>ระบบลิฟต์จำลอง</h1><p>ลิฟต์ 4 ตัว · อาคาร 20 ชั้น</p></div><a class=\"navlink\" href=\"/dashboard/dataflow\">ดูการส่งข้อมูลของระบบ →</a><span class=\"connection\" :class=\"{live: view.online}\">{{ view.online ? (view.state?.emulator ? '● เชื่อมต่อแล้ว (ตัวจำลอง ESP32)' : '● เชื่อมต่อ ESP32 แล้ว') : '○ รอการเชื่อมต่อ ESP32' }}</span></div>\r\n    <div class=\"journey\"><div><small>จุดเรียก</small><strong>ชั้น {{ hall }}</strong></div><span>→</span><div><small>ปลายทาง</small><strong>{{ dest ? 'ชั้น '+dest : 'เลือกในลิฟต์' }}</strong></div><div class=\"assignment\"><small>ลิฟต์ที่ได้รับมอบหมาย</small><strong>{{ view.state?.assigned !== '-' ? (view.state?.assigned || '—') : '—' }}</strong></div><label class=\"here\"><small>ตอนนี้คุณอยู่ชั้น</small><select v-model.number=\"myFloor\" :disabled=\"!canRequest\" @change=\"send({topic:'here',payload:myFloor})\"><option v-for=\"f in padFloors\" :key=\"f\" :value=\"f\">ชั้น {{ f }}</option></select></label><button v-if=\"canEnter\" class=\"enterbtn\" @click=\"send({topic:'enter',payload:true})\">เดินเข้าลิฟต์ {{ assigned }}</button><button :disabled=\"!canRequest\" @click=\"send({topic:'verify',payload:myFloor})\">เรียกลิฟต์ (ชั้น {{ myFloor }})</button></div>\r\n    <div class=\"offline-note\" v-if=\"!view.online\">{{ view.state ? 'ขาดการเชื่อมต่อ — แสดงข้อมูลล่าสุดที่ได้รับ' : 'ยังไม่มีข้อมูลจากบอร์ด กรุณาเปิด ESP32 และเชื่อมต่อ Wi-Fi' }}</div>\r\n    <section class=\"building\">\r\n      <div class=\"trip-banner\" :class=\"tripClass\">{{ tripText }}</div>\r\n      <div class=\"bldg-grid\">\r\n        <div class=\"floor-col\"><div class=\"bhead\"></div><div v-for=\"f in floorList\" :key=\"f\" class=\"flabel\" :class=\"{hall:f===hall,dest:f===dest}\">{{ f }}<em v-if=\"f===hall\">จุดเรียก</em><em v-else-if=\"f===dest\">ปลายทาง</em></div></div>\r\n        <div v-for=\"id in ids\" :key=\"id\" class=\"bshaft\" :class=\"{assigned: assigned===id}\">\r\n          <div class=\"bhead\">ลิฟต์ {{ id }}</div>\r\n          <div class=\"bbody\">\r\n            <div v-for=\"f in floorList\" :key=\"f\" class=\"rowline\" :class=\"{hall:f===hall,dest:f===dest}\"></div>\r\n            <div v-if=\"trail(id)\" class=\"trail\" :style=\"trail(id)\"></div>\r\n            <div class=\"bcar\" :class=\"carClass(id)\" :style=\"{bottom:(floorOf(id)-1)*24+2+'px'}\"><span class=\"cid\">{{ id }}</span><span class=\"cfl\">{{ floorOf(id) }}</span><span class=\"carrow\">{{ arrow(id) }}</span></div>\r\n          </div>\r\n        </div>\r\n      </div>\r\n    </section>\r\n    <section class=\"floorpad\" :class=\"{disabled:!canSelect}\">\r\n      <h2>แผงปุ่มในลิฟต์ {{ assigned || '' }} <small>{{ canSelect ? (typed ? 'แป้นกดที่บอร์ดกำลังกด '+typed+' (รอ #)' : 'กดเลือกชั้น หรือใช้แป้นกดที่บอร์ด ESP32 (ตัวเลข + #)') : (dest ? 'เลือกชั้น '+dest+' แล้ว' : (canEnter ? 'เดินเข้าลิฟต์ก่อน' : 'ปุ่มจะใช้ได้เมื่อลิฟต์มาถึง ประตูเปิด และคุณเดินเข้าไปแล้ว')) }}</small></h2>\r\n      <div class=\"pad\"><button v-for=\"f in padFloors\" :key=\"f\" :class=\"{chosen:f===dest}\" :disabled=\"!canSelect || f===floorOf(assigned)\" @click=\"send({topic:'select',payload:f})\">{{ f }}</button></div>\r\n    </section>\r\n    <div class=\"lift-cards\">\r\n      <article v-for=\"id in ['A','B','C','D']\" :key=\"id\" :class=\"['lift-card',{assigned: view.state?.assigned === id, stale:!view.online}]\">\r\n        <header><b>ลิฟต์ {{ id }}</b><span>{{ status(id) }}</span></header>\r\n        <div class=\"floor\"><strong>{{ view.state?.floors?.[id] ?? '—' }}</strong><span>ชั้นปัจจุบัน</span></div>\r\n        <div class=\"shaft\"><div class=\"car\" :style=\"{bottom: (((view.state?.floors?.[id] || 1)-1)/19*83)+'%'}\">{{ id }}</div><div class=\"shaft-label top\">20</div><div class=\"shaft-label bottom\">1</div></div>\r\n        <footer>{{ view.state?.assigned === id ? (ambientBusy ? 'ถูกเลือก (ถึงเร็วที่สุด)' : phaseLabel) : (etaText(id) || 'พร้อมรับงาน') }}<span v-if=\"etaText(id) && view.state?.assigned === id\"> · {{ etaText(id) }}</span></footer>\r\n      </article>\r\n    </div>\r\n    <div class=\"details\"><section><h2>หน้าจอที่บอร์ด</h2><div class=\"lcd\"><div>{{ view.state?.lcd?.[0] || 'WAITING FOR DATA' }}</div><div>{{ view.state?.lcd?.[1] || '                ' }}</div></div><p class=\"feedback\">{{ view.feedback || 'กดปุ่มบนบอร์ดหรือปุ่มเรียกลิฟต์ด้านบนเพื่อเริ่ม' }}</p><small>อัปเดตล่าสุด: {{ view.receivedAt ? new Date(view.receivedAt).toLocaleTimeString('th-TH') : '—' }}</small></section><section><h2>เหตุการณ์ล่าสุด</h2><div class=\"events\"><div v-for=\"(event,index) in (view.events || [])\" :key=\"index\"><time>{{ new Date(event.time).toLocaleTimeString('th-TH') }}</time><span>{{ event.text }}</span></div><p v-if=\"!view.events?.length\">รอเหตุการณ์จาก ESP32</p></div></section></div>\r\n    <p class=\"mockup-note\">แบบจำลอง: เลือกชั้นที่ยืนอยู่ แล้วเรียกลิฟต์ · เลือกชั้นปลายทางในลิฟต์ · 2 วินาทีต่อชั้น · รอเลือกชั้นสูงสุด 30 วินาที</p>\r\n  </div>\r\n",
  data() { return { ...component.data(), msg: { payload: {} } }; },
  methods: { ...component.methods,
    send(m) {
      if (m && m.topic === 'select') S.selectFloor(t, m.payload);
      else if (m && m.topic === 'enter') S.enter(t);
      else if (m && m.topic === 'here') S.setHall(Number(m.payload));
      else S.request(t, Number(m.payload) || 0);
      this.sync();
    },
    sync() {
      if (S.sim.phase !== lastPhase) { events.unshift({ time: Date.now(), text: labels[S.sim.phase] }); events.length = Math.min(events.length, 30); lastPhase = S.sim.phase; }
      this.msg = { payload: { online: true, pending: null, feedback: '', receivedAt: Date.now(), events: events.slice(), state: { ...S.stateBody(), emulator: true } } };
    } },
  mounted() {
    let last = performance.now();
    this.sync();
    setInterval(() => {
      const now = performance.now(), speed = +document.getElementById('speed').value;
      t += (now - last) * speed; last = now;
      S.tick(t); this.sync();
    }, 100);
    document.getElementById('speed').onchange = (e) => document.documentElement.style.setProperty('--step', (2 / +e.target.value) + 's');
    document.getElementById('reset').onclick = () => { S = SimCore.createSim(); t = 0; events.length = 0; lastPhase = 'idle'; this.sync(); };
  }
});
app.mount('#app');
</script></body></html>
