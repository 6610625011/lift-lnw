        <p>ทุกแถวด้านล่างคือข้อความ MQTT จริงที่ Node-RED รับ/ส่ง ไม่ใช่ภาพประกอบ</p></div>
      <a class="navlink" href="/dashboard/elevators">← กลับหน้าลิฟต์</a>
    </div>

    <div class="source" :class="srcClass">{{ srcText }}</div>

    <section class="card">
      <h2>เส้นทางของข้อมูล</h2>
      <div class="pipe">
        <div class="node" :class="{on: hops.esp, off: !hops.esp}"><b>ESP32</b><small>{{ hops.emulator ? 'ตัวจำลอง (fake-esp32)' : 'บอร์ดจริง' }}<br>ปุ่ม · LCD · LED<br>ลิฟต์ 4 ตัวจำลอง</small><i>{{ hops.esp ? 'ออนไลน์' : 'ไม่มีสัญญาณ' }}</i></div>
        <div class="link"><span class="dot up" :class="{go: upActive}"></span><span class="dot down" :class="{go: downActive}"></span><em>Wi-Fi<br>MQTT</em></div>
        <div class="node" :class="{on: hops.broker, off: !hops.broker}"><b>Mosquitto</b><small>MQTT broker<br>(Raspberry Pi / PC)<br>ตัวกลางส่งข้อความ</small><i>{{ hops.broker ? 'เชื่อมต่อ' : 'ไม่เชื่อมต่อ' }}</i></div>
        <div class="link"><span class="dot up" :class="{go: upActive}"></span><span class="dot down" :class="{go: downActive}"></span><em>MQTT</em></div>
        <div class="node on"><b>Node-RED</b><small>ตรวจข้อมูล<br>สร้างคำสั่ง<br>(Raspberry Pi / PC)</small><i>ทำงาน</i></div>
        <div class="link"><span class="dot up" :class="{go: upActive}"></span><span class="dot down" :class="{go: downActive}"></span><em>HTTP<br>WebSocket</em></div>
        <div class="node on"><b>Dashboard</b><small>เบราว์เซอร์<br>มือถือ / คอม</small><i>หน้านี้</i></div>
      </div>
      <p class="legend"><span class="dot up go static"></span> สถานะลิฟต์ / เหตุการณ์ วิ่งจาก ESP32 ไปหน้าเว็บ &nbsp;&nbsp; <span class="dot down go static"></span> คำสั่งเรียกลิฟต์ / เลือกชั้น วิ่งจากหน้าเว็บกลับไป ESP32 &nbsp;(จุดจะกระพริบเมื่อมีข้อความผ่านจริงภายใน 2 วินาทีที่ผ่านมา)</p>
      <div class="try"><button :disabled="!canTry" :title="canTry ? '' : 'ใช้ได้เมื่อลิฟต์ว่าง'" @click="send({topic:'verify',payload:1})">ลองส่งคำสั่ง "เรียกลิฟต์จากชั้น 1" จากหน้านี้</button><span>แล้วดูแถวสีส้ม (คำสั่งลงไป) ตามด้วยแถวสีเขียว (บอร์ดตอบกลับ) ในตารางด้านล่าง</span></div>

    <section class="card">

      <table><thead><tr><th>topic</th><th>ทิศทาง</th><th>หน้าที่</th><th>จำนวนที่เห็น</th><th>ล่าสุด</th></tr></thead>
        <tbody>
          <tr v-for="t in topics" :key="t.name"><td><code>elevator/v1/mockup/{{ t.name }}</code></td><td>{{ t.dir }}</td><td>{{ t.what }}</td><td><b>{{ (view.counts||{})[t.name] || 0 }}</b></td><td>{{ age(t.name) }}</td></tr>
        </tbody></table>

          <summary><time>{{ new Date(m.t).toLocaleTimeString('th-TH') }}</time><span class="tag">{{ tag(m) }}</span><span class="txt">{{ m.text }}</span></summary>
          <pre>{{ m.raw }}</pre>
        </details>

    </section>

    <section class="card how">
      <h2>อ่านภาพนี้อย่างไร</h2>
      <ol>
        <li><b>ESP32</b> คำนวณตำแหน่งลิฟต์ แล้วส่งสถานะเข้า <b>Mosquitto</b> ด้วย MQTT (topic <code>state</code>)</li>
        <li><b>Node-RED</b> สมัครรับ topic เดียวกัน ตรวจข้อมูล แล้วส่งต่อไปยัง <b>Dashboard</b> ที่คุณเปิดอยู่</li>

<script>
export default {
  data() { return { hideState: true, clock: Date.now(), offset: 0 }; },
  mounted() { this._t = setInterval(() => { this.clock = Date.now(); }, 500); },
  beforeUnmount() { clearInterval(this._t); },
  watch: { 'msg.payload.now': { immediate: true, handler(v) { if (v) this.offset = v - Date.now(); } } },
  computed: {
    view() { return this.msg?.payload || {}; },
    hops() { return this.view.hops || {}; },
    serverNow() { return this.clock + this.offset; },
    upActive() { const l = this.view.last || {}; return this.serverNow - Math.max(l.state || 0, l.events || 0) < 2000; },
    downActive() { const l = this.view.last || {}; return this.serverNow - (l.request || 0) < 2500; },
    canTry() { return !!this.hops.fresh && ['idle','arrived'].includes(this.hops.phase); },
    srcClass() { return !this.hops.fresh ? 'wait' : this.hops.emulator ? 'emu' : 'real'; },
    srcText() {
      if (!this.hops.fresh) return 'ยังไม่ได้รับข้อมูลสดจากบอร์ด — ตรวจว่า ESP32 (หรือตัวจำลอง) และ broker ทำงานอยู่';
      return this.hops.emulator ? 'ข้อมูลตอนนี้มาจาก "ตัวจำลอง ESP32" (scripts/fake-esp32.cjs) ที่พูด MQTT เหมือนบอร์ดจริง — ยังไม่ใช่บอร์ดจริง' : 'ข้อมูลตอนนี้มาจากบอร์ด ESP32 จริง (boot_id ' + this.hops.boot + ')';
    },
    topics() { return [
      {name: 'state', dir: 'ESP32 → Dashboard', what: 'ชั้นของลิฟต์ A–D, phase, ลิฟต์ที่ถูกเลือก, ข้อความ LCD (ส่งทุก 1 วินาที)'},
      {name: 'events', dir: 'ESP32 → Dashboard', what: 'เหตุการณ์: มอบหมายลิฟต์ ถึงจุดรับ เลือกชั้น ถึงปลายทาง และผลตอบรับคำสั่ง'},
      {name: 'availability', dir: 'ESP32/broker → Dashboard', what: 'online/offline (Last Will เมื่อบอร์ดหลุด)'},
      {name: 'request', dir: 'Dashboard → ESP32', what: 'คำสั่งเรียกลิฟต์ / เลือกชั้น พร้อมรหัสคำขอและอายุ 5 วินาที'}
    ]; },
    shown() { return (this.view.log || []).filter(m => !(this.hideState && m.name === 'state')).slice(0, 25); }
  },
  methods: {
    age(name) { const t = (this.view.last || {})[name]; if (!t) return '—'; const s = Math.max(0, Math.round((this.serverNow - t) / 1000)); return s + ' วินาทีที่แล้ว'; },
    tag(m) { return m.dir === 'down' ? '↓ คำสั่ง' : m.name === 'events' ? '↑ เหตุการณ์' : m.name === 'state' ? '↑ สถานะ' : '↑ ' + m.name; }
  }
}
</script>
