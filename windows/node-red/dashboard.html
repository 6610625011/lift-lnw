<template>
  <div class="elevator-app">
    <div class="lift-heading"><div><div class="eyebrow">ESP32 · MQTT · NODE-RED</div><h1>ระบบลิฟต์จำลอง</h1><p>ลิฟต์ 4 ตัว · อาคาร 20 ชั้น</p></div><a class="navlink" href="/dashboard/dataflow">ดูการส่งข้อมูลของระบบ →</a><span class="connection" :class="{live: view.online}">{{ view.online ? (view.state?.emulator ? '● เชื่อมต่อแล้ว (ตัวจำลอง ESP32)' : '● เชื่อมต่อ ESP32 แล้ว') : '○ รอการเชื่อมต่อ ESP32' }}</span></div>
    <div class="journey"><div><small>จุดเรียก</small><strong>ชั้น {{ hall }}</strong></div><span>→</span><div><small>ปลายทาง</small><strong>{{ dest ? 'ชั้น '+dest : 'เลือกในลิฟต์' }}</strong></div><div class="assignment"><small>ลิฟต์ที่ได้รับมอบหมาย</small><strong>{{ view.state?.assigned !== '-' ? (view.state?.assigned || '—') : '—' }}</strong></div><label class="here"><small>ตอนนี้คุณอยู่ชั้น</small><select v-model.number="myFloor" :disabled="!canRequest" @change="send({topic:'here',payload:myFloor})"><option v-for="f in padFloors" :key="f" :value="f">ชั้น {{ f }}</option></select></label><button v-if="canEnter" class="enterbtn" @click="send({topic:'enter',payload:true})">เดินเข้าลิฟต์ {{ assigned }}</button><button :disabled="!canRequest" @click="send({topic:'verify',payload:myFloor})">เรียกลิฟต์ (ชั้น {{ myFloor }})</button></div>
    <div class="offline-note" v-if="!view.online">{{ view.state ? 'ขาดการเชื่อมต่อ — แสดงข้อมูลล่าสุดที่ได้รับ' : 'ยังไม่มีข้อมูลจากบอร์ด กรุณาเปิด ESP32 และเชื่อมต่อ Wi-Fi' }}</div>
    <section class="building">
      <div class="trip-banner" :class="tripClass">{{ tripText }}</div>
      <div class="bldg-grid">
        <div class="floor-col"><div class="bhead"></div><div v-for="f in floorList" :key="f" class="flabel" :class="{hall:f===hall,dest:f===dest}">{{ f }}<em v-if="f===hall">จุดเรียก</em><em v-else-if="f===dest">ปลายทาง</em></div></div>
        <div v-for="id in ids" :key="id" class="bshaft" :class="{assigned: assigned===id}">
          <div class="bhead">ลิฟต์ {{ id }}</div>
          <div class="bbody">
            <div v-for="f in floorList" :key="f" class="rowline" :class="{hall:f===hall,dest:f===dest}"></div>
            <div v-if="trail(id)" class="trail" :style="trail(id)"></div>
            <div class="bcar" :class="carClass(id)" :style="{bottom:(floorOf(id)-1)*24+2+'px'}"><span class="cid">{{ id }}</span><span class="cfl">{{ floorOf(id) }}</span><span class="carrow">{{ arrow(id) }}</span></div>
          </div>
        </div>
      </div>
    </section>
    <section class="floorpad" :class="{disabled:!canSelect}">
      <h2>แผงปุ่มในลิฟต์ {{ assigned || '' }} <small>{{ canSelect ? (typed ? 'แป้นกดที่บอร์ดกำลังกด '+typed+' (รอ #)' : 'กดเลือกชั้น หรือใช้แป้นกดที่บอร์ด ESP32 (ตัวเลข + #)') : (dest ? 'เลือกชั้น '+dest+' แล้ว' : (canEnter ? 'เดินเข้าลิฟต์ก่อน' : 'ปุ่มจะใช้ได้เมื่อลิฟต์มาถึง ประตูเปิด และคุณเดินเข้าไปแล้ว')) }}</small></h2>
      <div class="pad"><button v-for="f in padFloors" :key="f" :class="{chosen:f===dest}" :disabled="!canSelect || f===floorOf(assigned)" @click="send({topic:'select',payload:f})">{{ f }}</button></div>
    </section>
    <div class="lift-cards">
      <article v-for="id in ['A','B','C','D']" :key="id" :class="['lift-card',{assigned: view.state?.assigned === id, stale:!view.online}]">
        <header><b>ลิฟต์ {{ id }}</b><span>{{ status(id) }}</span></header>
        <div class="floor"><strong>{{ view.state?.floors?.[id] ?? '—' }}</strong><span>ชั้นปัจจุบัน</span></div>
        <div class="shaft"><div class="car" :style="{bottom: (((view.state?.floors?.[id] || 1)-1)/19*83)+'%'}">{{ id }}</div><div class="shaft-label top">20</div><div class="shaft-label bottom">1</div></div>
        <footer>{{ view.state?.assigned === id ? (ambientBusy ? 'ถูกเลือก (ถึงเร็วที่สุด)' : phaseLabel) : (etaText(id) || 'พร้อมรับงาน') }}<span v-if="etaText(id) && view.state?.assigned === id"> · {{ etaText(id) }}</span></footer>
      </article>
    </div>
    <div class="details"><section><h2>หน้าจอที่บอร์ด</h2><div class="lcd"><div>{{ view.state?.lcd?.[0] || 'WAITING FOR DATA' }}</div><div>{{ view.state?.lcd?.[1] || '                ' }}</div></div><p class="feedback">{{ view.feedback || 'กดปุ่มบนบอร์ดหรือปุ่มเรียกลิฟต์ด้านบนเพื่อเริ่ม' }}</p><small>อัปเดตล่าสุด: {{ view.receivedAt ? new Date(view.receivedAt).toLocaleTimeString('th-TH') : '—' }}</small></section><section><h2>เหตุการณ์ล่าสุด</h2><div class="events"><div v-for="(event,index) in (view.events || [])" :key="index"><time>{{ new Date(event.time).toLocaleTimeString('th-TH') }}</time><span>{{ event.text }}</span></div><p v-if="!view.events?.length">รอเหตุการณ์จาก ESP32</p></div></section></div>
    <p class="mockup-note">แบบจำลอง: เลือกชั้นที่ยืนอยู่ แล้วเรียกลิฟต์ · เลือกชั้นปลายทางในลิฟต์ · 2 วินาทีต่อชั้น · รอเลือกชั้นสูงสุด 30 วินาที</p>
  </div>
</template>
<script>
export default {
  data() { return { myFloor: 1 }; },
  watch: { 'msg.payload.state.hall_floor': { immediate: true, handler(v) { if (v && (this.msg?.payload?.state?.phase || 'idle') === 'idle') this.myFloor = v; } } },
  computed: {
    view() { return this.msg?.payload || {}; },
    busyOthers() { return this.ids.some(id => (this.view.state?.targets?.[id]||0)>0); },
    ids() { return ['A','B','C','D']; },
    floorList() { return Array.from({length:20},(_,i)=>20-i); },
    hall() { return this.phase==='idle' ? this.myFloor : (this.view.state?.hall_floor || 1); },
    dest() { return this.view.state?.destination || 0; },
    canSelect() { return this.view.online && this.phase==='boarding' && !!this.view.state?.boarded && !this.dest && !this.view.pending; },
    canEnter() { return this.view.online && this.phase==='boarding' && !this.view.state?.boarded && !this.view.pending; },
    typed() { return this.view.state?.entry || 0; },
    padFloors() { return Array.from({length:20},(_,i)=>i+1); },
    assigned() { const a=this.view.state?.assigned; return a && a!=='-' ? a : null; },
    phase() { return this.view.state?.phase || 'idle'; },
    target() { return this.phase==='coming' ? this.hall : this.phase==='riding' ? this.dest : null; },
    ambientBusy() { return !!this.assigned && this.phase==='coming' && (this.view.state?.targets?.[this.assigned]||0)>0; },
    moving() { return this.view.online && this.assigned && this.target!==null && !this.ambientBusy; },
    direction() { if(!this.moving) return 0; return Math.sign(this.target-this.floorOf(this.assigned)); },
    remaining() { return this.moving ? Math.abs(this.target-this.floorOf(this.assigned)) : 0; },
    tripClass() { return !this.view.online ? 'off' : this.phase; },
    tripText() {
      if(!this.view.online) return 'รอข้อมูลสดจาก ESP32';
      const a=this.assigned, f=a?this.floorOf(a):0, n=this.remaining;
      if(this.ambientBusy) return 'ไปที่ลิฟต์ '+a+' · ลิฟต์ส่งผู้โดยสารอื่นถึงชั้น '+this.view.state.targets[a]+' ก่อน แล้วจะมารับคุณที่ชั้น '+this.hall+' (ประเมิน ~'+(this.view.state?.eta_s?.[a]??'?')+' วินาที)';
      if(this.phase==='coming') return 'ไปที่ลิฟต์ '+a+' · กำลัง'+(this.direction<0?'ลงมา':'ขึ้นไป')+'รับที่ชั้น '+this.hall+' · ตอนนี้ชั้น '+f+' · อีก '+n+' ชั้น (~'+n*2+' วินาที)';
      if(this.phase==='boarding') { if(this.dest) return 'เลือกชั้น '+this.dest+' แล้ว · ประตูกำลังปิด';
      if(!this.view.state?.boarded) return 'ลิฟต์ '+a+' เปิดประตูรออยู่ที่ชั้น '+this.hall+' · กด "เดินเข้าลิฟต์ '+a+'" (หรือกดปุ่มที่บอร์ด ESP32)';
      return this.typed ? 'คุณอยู่ในลิฟต์ '+a+' · กำลังกดชั้น '+this.typed+' ที่แป้นกด · กด # เพื่อยืนยัน' : 'คุณอยู่ในลิฟต์ '+a+' · กดเลือกชั้นที่แป้นกดบนบอร์ด ESP32 (หรือแผงปุ่มบนหน้าเว็บ)'; }
      if(this.phase==='riding') return 'ลิฟต์ '+a+' กำลังพา'+(this.direction<0?'ลง':'ขึ้น')+'ไปชั้น '+this.dest+' · ตอนนี้ชั้น '+f+' · อีก '+n+' ชั้น (~'+n*2+' วินาที)';
      if(this.phase==='arrived') return 'ลิฟต์ '+a+' ถึงชั้น '+this.dest+' แล้ว';
      return this.busyOthers ? 'ลิฟต์บางตัวกำลังพาผู้โดยสารอื่นอยู่ · เลือกชั้นที่ยืน แล้วกดเรียกลิฟต์ ระบบจะคำนวณว่าตัวไหนถึงเร็วที่สุด' : 'ลิฟต์ทุกตัวว่าง · เลือกชั้นที่ยืน แล้วกดเรียกลิฟต์';
    },
    canRequest() { return this.view.online && ['idle','arrived'].includes(this.view.state?.phase) && !this.view.pending; },
    phaseLabel() { return {idle:'พร้อมรับงาน',coming:'กำลังมารับ',boarding:'ประตูเปิด / รอเลือกชั้น',riding:'กำลังไปชั้นปลายทาง',arrived:'ถึงปลายทางแล้ว'}[this.view.state?.phase] || 'รอข้อมูล'; }
  },
  methods: {
    floorOf(id) { return this.view.state?.floors?.[id] ?? 1; },
    otherTarget(id) { const t=this.view.state?.targets?.[id]||0; return t && t!==this.floorOf(id) ? t : 0; },
    arrow(id) { if(id===this.assigned && this.moving) return this.direction>0?'▲':'▼'; const t=this.otherTarget(id); return t ? (t>this.floorOf(id)?'▲':'▼') : ''; },
    carClass(id) { const mine=id===this.assigned && this.moving; return {assigned:id===this.assigned, moving:mine, ambient:!mine && !!this.otherTarget(id), stale:!this.view.online, 'has-state':!!this.view.state}; },
    trail(id) {
      if(id!==this.assigned || !this.moving) return null;
      const f=this.floorOf(id), t=this.target;
      return {bottom:(Math.min(f,t)-1)*24+14+'px', height:Math.abs(t-f)*24+'px'};
    },
    status(id) { if(!this.view.online) return 'ข้อมูลไม่สด'; if(this.view.state?.assigned === id) return this.ambientBusy ? 'ส่งผู้โดยสารอื่นก่อน' : this.phaseLabel; const t=this.view.state?.targets?.[id]||0; return t ? (this.otherTarget(id) ? 'พาผู้โดยสารไปชั้น '+t : 'ผู้โดยสารกำลังลง') : 'ว่าง'; },
    etaText(id) { const e=this.view.state?.eta_s?.[id]; return e===undefined ? '' : 'ประเมินถึงคุณ ~'+e+' วินาที'; }
  }
}
</script>
